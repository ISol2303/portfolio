spring.application.name=portfolio-api
server.port=8080

spring.datasource.url=jdbc:h2:mem:portfolio_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

app.jwt.secret=portfolio-demo-secret-key-change-this-value-to-at-least-256-bits
app.jwt.expiration-minutes=60
app.cors.allowed-origin=http://localhost:5173
